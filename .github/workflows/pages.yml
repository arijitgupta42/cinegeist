name: Publish the demo to GitHub Pages

# Builds the static browser demo and deploys it to GitHub Pages. The deploy step needs Pages turned
# on for the repository (Settings → Pages → Source: "GitHub Actions"). On the free plan that also
# means the repository has to be public; a private repo needs a paid plan for Pages.
#
# The repo is deliberately kept private for now, so this runs on manual dispatch only and stays
# dormant — nothing deploys until someone runs it. Once Pages is enabled, add an automatic trigger:
#
#   push:
#     branches: [main]
#     paths: ["web/**", ".github/workflows/pages.yml"]

on:
  workflow_dispatch:

# Let the deploy publish to Pages via OIDC, and read the repo to build it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
